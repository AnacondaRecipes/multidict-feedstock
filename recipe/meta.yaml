{% set name = "multidict" %}
{% set version = "7.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a7fcd089a0af2e0ef053c0d39c22c9ebf2434dddcb91034fd2f59ec99623788e

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    # https://github.com/aio-libs/multidict/blob/v7.0.0/requirements/cython.txt
    - cython >=3.0
    - pip
    - setuptools >=47
    - wheel
  run:
    - python
    # upstream source https://github.com/aio-libs/multidict/blob/a8d89e44b6fbc68ef409b2f84ae68a8af84edfc9/setup.cfg#L43
    - typing-extensions >=4.1.0  # [py<311]

# test_leak: subprocess.CalledProcessError: Command '['$PREFIX/bin/python', '-u', '$SRC_DIR/tests/isolated/multidict_pop.py']' returned non-zero exit status 1.
{% set deselected_tests = " --deselect=tests/test_leaks.py::test_leak" %}
# pytest-codspeed 5.0.3 has no py315 build on defaults. These modules import
# pytest_codspeed at collection; they are benchmarks, not correctness tests.
{% set py315_skip = " --ignore=tests/test_multidict_benchmarks.py --ignore=tests/test_views_benchmarks.py" %}  # [py>=315]
{% set py315_skip = "" %}  # [py<315]

test:
  source_files:
    - tests
    - tools
  imports:
    - multidict
  requires:
    # upstream source https://github.com/aio-libs/multidict/blob/v7.0.0/requirements/pytest.txt
    - pytest
    # no py315 build of 5.0.3 on defaults (linux-64/aarch64, osx-arm64, win-64)
    - pytest-codspeed ==5.0.3  # [py<315]
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv {{ deselected_tests }}{{ py315_skip }} tests

about:
  home: https://github.com/aio-libs/multidict
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: The multidict implementation
  description: |
    Multidicts are useful for working with HTTP headers, URL query args etc.
  doc_url: https://multidict.aio-libs.org
  dev_url: https://github.com/aio-libs/multidict

extra:
  recipe-maintainers:
    - sodre
    - kszucs
